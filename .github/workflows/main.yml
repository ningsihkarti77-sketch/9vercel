name: Daily Commit

on:
  schedule:
    # 17:00 UTC = 00:00 WIB, jalan setiap hari
    - cron: "0 17 * * *"
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "Last update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.log

      - name: Commit and push
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: daily update $(date -u '+%Y-%m-%d')"
          git push
